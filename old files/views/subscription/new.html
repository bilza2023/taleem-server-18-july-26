<!DOCTYPE html>

<html lang="en" data-theme="dark">

<head>

	<meta charset="UTF-8">

	<meta
		name="viewport"
		content="width=device-width, initial-scale=1.0"
	>

	<title>

		➕ New Subscription

	</title>

	<link
		rel="stylesheet"
		href="../tools/simple.css"
	>

	<link
		rel="stylesheet"
		href="../tools/utilities.css"
	>

</head>

<body>

	<header>

		<h1>

			💳 Taleem Subscriptions

		</h1>

		<nav>

			<a href="index.html">

				🏠 Subscriptions

			</a>

			<a href="new.html">

				➕ New

			</a>

			<a href="../index.html">

				🧰 Utilities

			</a>

		</nav>

	</header>

	<h2>

		➕ New Subscription

	</h2>

	<form id="subscriptionForm">

		<p>

			<label>Email</label>

			<input
				type="email"
				name="email"
				required
			>

		</p>

		<p>

			<label>Course Slug</label>

			<input
				name="courseSlug"
				required
			>

		</p>

		<p>

			<label>Starts At</label>

			<input
				type="date"
				name="startsAt"
				required
			>

		</p>

		<p>

			<label>Ends At</label>

			<input
				type="date"
				name="endsAt"
				required
			>

		</p>

		<button type="submit">

			➕ Create

		</button>

	</form>

	<script type="module">

		import {
			config
		}
		from "../tools/config.js";

		import apiFetch
		from "../tools/fetch.js";

		const token =
			localStorage.getItem(
				"taleem-token"
			);

		if (!token) {

			location.href =
				config.serverUrl +
				"/api/forms/login";

			throw new Error(
				"taleem-token not found."
			);

		}

		const form =
			document.getElementById(
				"subscriptionForm"
			);

		form.onsubmit =
			async (
				event
			) => {

				event.preventDefault();

				const data =
					Object.fromEntries(

						new FormData(
							form
						)

					);

				await apiFetch(

					"POST",

					"/api/admin/subscription",

					data

				);

				location.href =
					"index.html";

			};

	</script>

</body>

</html>
