<!DOCTYPE html>

<html lang="en" data-theme="dark">

<head>

	<meta charset="UTF-8">

	<meta
		name="viewport"
		content="width=device-width, initial-scale=1.0"
	>

	<title>

		💬 Communication Inbox

	</title>

	<link
		rel="stylesheet"
		href="../tools/simple.css"
	>

	<link
		rel="stylesheet"
		href="../tools/utilities.css"
	>

</head>

<body>

	<header>

		<h1>

			💬 Communication Inbox

		</h1>

		<nav>

			<a href="index.html">

				🏠 Inbox

			</a>

			<a href="../index.html">

				🧰 Utilities

			</a>

		</nav>

	</header>

	<h2 id="count">

		Loading...

	</h2>

	<div id="communications">

	</div>

	<script type="module">

		import {
			config
		}
		from "../tools/config.js";

		import apiFetch
		from "../tools/fetch.js";

		const token =
			localStorage.getItem(
				"taleem-token"
			);

		if (!token) {

			location.href =
				config.serverUrl +
				"/api/forms/login";

			throw new Error(
				"taleem-token not found."
			);

		}

		const container =
			document.getElementById(
				"communications"
			);

		const count =
			document.getElementById(
				"count"
			);

		async function load() {

			container.innerHTML = "";

const items =
	await apiFetch(

		"GET",

		"/api/admin/communication/inbox"

	);

			count.textContent =
				`💬 ${items.length} Remaining`;

			for (

				const item of items

			) {

				const card =
					document.createElement(
						"article"
					);

				card.innerHTML = `

					<h3>

						${item.user.email}

					</h3>

					<p>

						<b>Reference:</b>
						${item.referenceId}

					</p>

					<p>

						<b>Type:</b>
						${item.type}

					</p>

					<p>

						<b>Meta:</b>
						${item.meta ?? ""}

					</p>

					<p>

						${item.message}

					</p>

					<p>

						<textarea
							rows="5"
							placeholder="Response..."
						></textarea>

					</p>

					<p>

						<button
							class="public"
						>

							📢 Send Public

						</button>

						<button
							class="private"
						>

							🔒 Send Private

						</button>

					</p>

				`;

				const textarea =
					card.querySelector(
						"textarea"
					);

				card.querySelector(
					".public"
				).onclick =
					() =>
						send(
							item.id,
							textarea.value,
							true,
							card
						);

				card.querySelector(
					".private"
				).onclick =
					() =>
						send(
							item.id,
							textarea.value,
							false,
							card
						);

				container.appendChild(
					card
				);

			}

		}

		async function send(

			id,
			authorResponse,
			isPublic,
			card

		) {

			await apiFetch(

				"PUT",

				`/api/admin/communication/${id}`,

				{

					authorResponse,

					isPublic

				}

			);

			card.remove();

			count.textContent =
				`💬 ${container.children.length} Remaining`;

		}

		load();

	</script>

</body>

</html>
