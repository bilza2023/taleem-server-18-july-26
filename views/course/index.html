<!DOCTYPE html>

<html lang="en" data-theme="dark">

<head>

	<meta charset="UTF-8">

	<meta
		name="viewport"
		content="width=device-width, initial-scale=1.0"
	>

	<title>

		📚 Taleem Courses

	</title>

	<link
		rel="stylesheet"
		href="../tools/simple.css"
	>

	<link
		rel="stylesheet"
		href="../tools/utilities.css"
	>

</head>

<body>

	<header>

		<h1>

			📚 Taleem Courses

		</h1>

		<nav>

			<a href="index.html">

				🏠 Courses

			</a>

			<a href="new.html">

				➕ New

			</a>

			<a
				href="../index.html"
			>

				🧰 Utilities

			</a>

		</nav>

	</header>

	<table id="courseTable">

		<thead>

			<tr>

				<th>🔗 Slug</th>

				<th>📝 Title</th>

				<th>🔒 Access</th>

				<th>💰 Price</th>

				<th>⚙️</th>

			</tr>

		</thead>

		<tbody>

		</tbody>

	</table>

	<script type="module">

		import {
			config
		}
		from "../tools/config.js";

		import apiFetch
		from "../tools/fetch.js";

		const token =
			localStorage.getItem(
				"taleem-token"
			);

		if (

			!token

		) {

			location.href =
				config.serverUrl +
				"/api/forms/login";

			throw new Error(
				"taleem-token not found."
			);

		}

		try {

			const items =
				await apiFetch(

					"GET",

					"/api/admin/course"

				);

			const tbody =
				document.querySelector(
					"#courseTable tbody"
				);

			for (

				const item of items

			) {

				const row =
					document.createElement(
						"tr"
					);

				row.innerHTML = `

					<td>

						<code>

							${item.slug}

						</code>

					</td>

					<td>

						${item.title}

					</td>

					<td>

						${item.access}

					</td>

					<td>

						${item.price}

					</td>

					<td>

						<a
							href="edit.html?slug=${item.slug}"
						>

							✏️ Edit

						</a>

					</td>

				`;

				tbody.appendChild(
					row
				);

			}

		}

		catch (

			err

		) {

			console.error(
				err
			);

			alert(
				err.message
			);

		}

	</script>

</body>

</html>
