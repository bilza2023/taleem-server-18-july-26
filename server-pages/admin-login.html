<!DOCTYPE html>
<html lang="en">

<head>

	<meta charset="UTF-8" />
	<meta
		name="viewport"
		content="width=device-width, initial-scale=1.0"
	/>

	<title>Taleem Server - Administrator Login</title>

	<style>
		:root {
			color-scheme: dark;
		}

		body {
			font-family: system-ui, sans-serif;
			max-width: 560px;
			margin: 40px auto;
			padding: 24px;
			line-height: 1.5;
			background: #181818;
			color: #eee;
		}

		h1,
		h2 {
			margin-top: 0;
		}

		form {
			margin-bottom: 20px;
		}

		label {
			display: block;
			margin-top: 16px;
			margin-bottom: 6px;
			font-weight: 600;
		}

		input[type="email"],
		input[type="password"],
		button,
		textarea {
			width: 100%;
			padding: 10px;
			margin: 0;
			box-sizing: border-box;
			font-size: 1rem;
			border: 1px solid #555;
			border-radius: 4px;
			background: #262626;
			color: #eee;
		}

		button {
			margin-top: 18px;
			cursor: pointer;
			background: #2f6fed;
			border: none;
			font-weight: bold;
		}

		button:hover {
			background: #4780f5;
		}

		.checkbox-row {
			display: flex;
			align-items: flex-start;
			gap: 10px;
			margin-top: 18px;
		}

		.checkbox-row input {
			width: auto;
			margin-top: 4px;
		}

		.checkbox-row label {
			margin: 0;
			font-weight: normal;
		}

		textarea {
			height: 180px;
			margin-top: 10px;
			font-family: monospace;
		}

		.success {
			color: #7CFC8A;
			font-weight: bold;
		}

		.error {
			color: #ff8080;
			font-weight: bold;
		}

		.note {
			margin-top: 20px;
			padding: 12px;
			border: 1px solid #444;
			border-radius: 4px;
			background: #202020;
			font-size: 0.95rem;
			color: #ccc;
		}

		code {
			color: #8ec8ff;
		}
	</style>

</head>

<body>

	<h1>Taleem Server</h1>

	<h2>Administrator Login</h2>

	<form id="loginForm">

		<label for="email">
			Email
		</label>

		<input
			type="email"
			id="email"
			required
			autocomplete="username"
		/>

		<label for="password">
			Password
		</label>

		<input
			type="password"
			id="password"
			required
			autocomplete="current-password"
		/>

		<div class="checkbox-row">

			<input
				type="checkbox"
				id="remember"
				checked
			/>

			<label for="remember">
				Remember this login on this browser
				(<code>taleem-token</code> and
				<code>taleem-email</code> in localStorage)
			</label>

		</div>

		<button type="submit">
			Administrator Login
		</button>

	</form>

	<p id="status"></p>

	<textarea
		id="result"
		readonly
		placeholder="Server response..."
	></textarea>

	<div class="note">

		<b>Administrator Login</b>

		<p>
			This page is the official administrator login form
			for Taleem Server administration utilities.
		</p>

		<p>
			If "Remember this login" is checked and login succeeds,
			the following values are written to localStorage:
		</p>

		<ul>
			<li><code>taleem-token</code></li>
			<li><code>taleem-email</code></li>
		</ul>

	</div>

	<script>

		const form = document.getElementById("loginForm");

		const email = document.getElementById("email");

		const password = document.getElementById("password");

		const remember = document.getElementById("remember");

		const status = document.getElementById("status");

		const result = document.getElementById("result");

		form.addEventListener("submit", async (event) => {

			event.preventDefault();

			status.textContent = "Logging in...";

			status.className = "";

			result.value = "";

			try {

				const response = await fetch(
					"/api/admin/login",
					{
						method: "POST",
						headers: {
							"Content-Type": "application/json"
						},
						body: JSON.stringify({
							email: email.value,
							password: password.value
						})
					}
				);

				const data = await response.json();

				result.value = JSON.stringify(data, null, 2);

				if (response.ok) {

					if (remember.checked) {

						localStorage.setItem(
							"taleem-token",
							data.token
						);

						localStorage.setItem(
							"taleem-email",
							email.value
						);

						status.textContent =
							"✓ Administrator login successful. taleem-token and taleem-email saved to localStorage.";

					}
					else {

						status.textContent =
							"✓ Administrator login successful.";

					}

					status.className = "success";

				}
				else {

					status.textContent =
						data.error || "Login failed.";

					status.className = "error";

				}

			}
			catch (err) {

				status.textContent = err.message;

				status.className = "error";

			}

		});

	</script>

</body>

</html>
