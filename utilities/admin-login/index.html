<!DOCTYPE html>

<html lang="en">

<head>

	<meta charset="UTF-8">

	<meta
		name="viewport"
		content="width=device-width, initial-scale=1.0"
	>

	<title>Taleem Admin Login</title>

	<link
		rel="stylesheet"
		href="styles.css"
	>

</head>

<body>

	<header>

		<div class="title">

			📚 Taleem Admin Login

		</div>

		<div class="toolbar">

			<button id="utilities">

				Utilities

			</button>

			<button id="logout">

				Logout

			</button>

		</div>

	</header>

	<main>

		<div class="panel">

			<label for="server">

				Server

			</label>

			<input

				id="server"

				type="text"

				value="http://127.0.0.1:9000"

			>

			<label for="email">

				Email

			</label>

			<input

				id="email"

				type="email"

				placeholder="admin@example.com"

			>

			<label for="password">

				Password

			</label>

			<input

				id="password"

				type="password"

			>

			<button id="login">

				Login

			</button>

			<p id="status"></p>

		</div>

	</main>

	<script
		type="module"
		src="app.js"
	></script>

</body>

</html>
