<!DOCTYPE html>

<html lang="en" data-theme="dark">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>

        ✏️ Edit Course

    </title>

    <link
        rel="stylesheet"
        href="../tools/simple.css"
    >

    <link
        rel="stylesheet"
        href="../tools/utilities.css"
    >

</head>

<body>

    <header>

        <h1>

            🎓 Taleem Courses

        </h1>

        <nav>

            <a href="index.html">

                🏠 Courses

            </a>

            <a href="new.html">

                ➕ New

            </a>

            <a href="../index.html">

                🧰 Utilities

            </a>

        </nav>

    </header>

    <h2>

        ✏️ Edit Course

    </h2>

    <form id="courseForm">

        <p>

            <label>Slug</label>

            <input
                name="slug"
                readonly
            >

        </p>

        <p>

            <label>Title</label>

            <input
                name="title"
                required
            >

        </p>

        <p>

            <label>Description</label>

            <textarea
                name="description"
                rows="3"
            ></textarea>

        </p>

        <p>

            <label>Access</label>

            <select
                name="access"
            >

                <option>PUBLIC</option>
                <option>MEMBERS</option>
                <option>SUBSCRIPTION</option>

            </select>

        </p>

        <button type="submit">

            💾 Save

        </button>

    </form>

<script type="module">

    import "../tools/toolbar.js";

    import {

        getTaleemConnection

    } from "../tools/getTaleemConnection.js";

    try {

        const taleem =
            await getTaleemConnection();

        const slug =
            new URLSearchParams(

                location.search

            ).get(

                "slug"

            );

        if (!slug) {

            location.href =
                "index.html";

        }

        const form =
            document.getElementById(
                "courseForm"
            );

        const item =
            await taleem.course.read(
                slug
            );

        for (const key in item) {

            if (

                form.elements[key]

            ) {

                form.elements[key].value =
                    item[key] ?? "";

            }

        }

        form.onsubmit =
            async (event) => {

                event.preventDefault();

                const data =
                    Object.fromEntries(

                        new FormData(
                            form
                        )

                    );

                await taleem.course.update(

                    slug,

                    data

                );

                location.href =
                    "index.html";

            };

    }

    catch (err) {

        console.error(err);

    }

</script>

</body>

</html>
