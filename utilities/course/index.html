<!DOCTYPE html>

<html lang="en" data-theme="dark">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>

        📚 Taleem Courses

    </title>

    <link
        rel="stylesheet"
        href="../tools/simple.css"
    >

    <link
        rel="stylesheet"
        href="../tools/utilities.css"
    >

</head>

<body>

    <header>

        <h1>

            📚 Taleem Courses

        </h1>

        <nav>

            <a href="index.html">

                🏠 Courses

            </a>

            <a href="new.html">

                ➕ New

            </a>

            <a href="../index.html">

                🧰 Utilities

            </a>

        </nav>

    </header>

    <table id="courseTable">

        <thead>

            <tr>

                <th>🔗 Slug</th>
                <th>📝 Title</th>
                <th>📄 Description</th>
                <th>🔐 Access</th>
                <th>⚙️</th>

            </tr>

        </thead>

        <tbody>

        </tbody>

    </table>

<script type="module">

import "../tools/toolbar.js";

import {

    getTaleemConnection

} from "../tools/getTaleemConnection.js";

try {

    const api =
        await getTaleemConnection();

    const items =
        await api.fetch(
            "/api/course"
        );

    const tbody =
        document.querySelector(
            "#courseTable tbody"
        );

    for (const item of items) {

        const row =
            document.createElement(
                "tr"
            );

        row.innerHTML = `

            <td><code>${item.slug}</code></td>

            <td>${item.title}</td>

            <td>${item.description ?? "—"}</td>

            <td>${item.access}</td>

            <td>

                <a
                    href="edit.html?slug=${item.slug}"
                >

                    ✏️ Edit

                </a>

            </td>

        `;

        tbody.appendChild(
            row
        );

    }

}

catch (err) {

    console.error(err);

}

</script>

</body>

</html>
