<!DOCTYPE html>

<html lang="en" data-theme="dark">

<head>

	<meta charset="UTF-8">

	<meta
		name="viewport"
		content="width=device-width, initial-scale=1.0"
	>

	<title>

		📚 Taleem Library

	</title>

	<link
		rel="stylesheet"
		href="../tools/simple.css"
	>

	<link
		rel="stylesheet"
		href="../tools/utilities.css"
	>

</head>

<body>

	<header>

		<h1>

			📚 Taleem Library

		</h1>

		<nav>

			<a href="index.html">

				🏠 Library

			</a>

			<a href="new.html">

				➕ New

			</a>

			<a
				href="../index.html"
			>

				🧰 Utilities

			</a>

		</nav>

	</header>

	<table id="libraryTable">

		<thead>

			<tr>

				<th>🔗 Slug</th>

				<th>📝 Title</th>

				<th>📦 Course</th>

				<th>📄 Type</th>

				<th>⚙️</th>

			</tr>

		</thead>

		<tbody>

		</tbody>

	</table>

	<script type="module">

		import {
			config
		}
		from "../tools/config.js";

		import {
			TaleemAdminClient
		}
		from "../tools/taleem-admin-client.js";

		const token =
			localStorage.getItem(
				"taleem-token"
			);

		if (

			!token

		) {

			location.href =
				config.serverUrl +
				"/api/forms/login";

			throw new Error(
				"taleem-token not found."
			);

		}

		const client =
			new TaleemAdminClient(

				config.serverUrl,

				token

			);

		try {

			const items =
				await client.library.list();

			const tbody =
				document.querySelector(
					"#libraryTable tbody"
				);

			for (

				const item of items

			) {

				const row =
					document.createElement(
						"tr"
					);

				row.innerHTML = `

					<td>

						<code>

							${item.slug}

						</code>

					</td>

					<td>

						${item.title}

					</td>

					<td>

						${item.courseSlug ?? "—"}

					</td>

					<td>

						${item.type}

					</td>

					<td>

						<a
							href="edit.html?slug=${item.slug}"
						>

							✏️ Edit

						</a>

					</td>

				`;

				tbody.appendChild(
					row
				);

			}

		}

		catch (

			err

		) {

			console.error(
				err
			);

			alert(
				err.message
			);

		}

	</script>

</body>

</html>
