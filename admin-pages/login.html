<!DOCTYPE html>
<html lang="en">

<head>

	<meta charset="UTF-8">

	<meta
		name="viewport"
		content="width=device-width, initial-scale=1.0"
	>

	<title>Taleem Server Administration - Login</title>

	<link
		rel="stylesheet"
		href="/api/css/admin"
	>

</head>

<body>

	<h1>Taleem Server Administration</h1>

	<h2>Administrator Login</h2>

	<form id="loginForm">

		<p>

			<label>

				Email

				<br>

				<input
					type="email"
					id="email"
					required
				>

			</label>

		</p>

		<p>

			<label>

				Password

				<br>

				<input
					type="password"
					id="password"
					required
				>

			</label>

		</p>

		<p>

			<button type="submit">

				Sign In

			</button>

		</p>

	</form>

	<p id="error"></p>

	<script type="module">

		import admin from "/api/js/admin";

		const form =
			document.getElementById("loginForm");

		const error =
			document.getElementById("error");

		form.addEventListener("submit", async event => {

			event.preventDefault();

			error.textContent = "";

			try {

				const response = await fetch(

					"/api/admin/login",

					{
						method: "POST",

						headers: {
							"Content-Type": "application/json"
						},

						body: JSON.stringify({

							email:
								document.getElementById("email").value,

							password:
								document.getElementById("password").value

						})

					}

				);

				const data =
					await response.json();

				if (!response.ok) {

					error.textContent =
						data.error ?? "Login failed.";

					return;

				}

				admin.setToken(data.token);

				location.replace(
					"/api/admin/pages/dashboard"
				);

			}
			catch (err) {

				error.textContent =
					err.message;

			}

		});

	</script>

</body>

</html>
