<!DOCTYPE html>
<html lang="en">

<head>

	<meta charset="UTF-8">

	<meta
		name="viewport"
		content="width=device-width, initial-scale=1.0"
	>

	<title>Taleem Server Administration</title>

	<link
		rel="stylesheet"
		href="/api/css/admin"
	>

</head>

<body>

	<h1>Taleem Server Administration</h1>

	<p>Loading...</p>

	<script type="module">

		import admin from "/api/js/admin";

		try {

			if (admin.verify()) {

				location.replace(
					"/api/admin/pages/dashboard"
				);

			}
			else {

				location.replace(
					"/api/admin/pages/login"
				);

			}

		}
		catch {

			location.replace(
				"/api/admin/pages/login"
			);

		}

	</script>

</body>

</html>
