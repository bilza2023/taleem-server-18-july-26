<!DOCTYPE html>
<html lang="en">

<head>

	<meta charset="UTF-8" />

	<meta
		name="viewport"
		content="width=device-width, initial-scale=1.0"
	/>

	<title>Taleem Server - Administrator Login</title>

	<style>

		:root {
			color-scheme: dark;
		}

		body {
			font-family: system-ui, sans-serif;
			max-width: 420px;
			margin: 60px auto;
			padding: 24px;
			background: #181818;
			color: #eee;
		}

		h1 {
			margin-top: 0;
			margin-bottom: 28px;
		}

		label {
			display: block;
			margin-top: 16px;
			margin-bottom: 6px;
			font-weight: 600;
		}

		input,
		button {
			width: 100%;
			padding: 10px;
			box-sizing: border-box;
			font-size: 1rem;
			border: 1px solid #555;
			border-radius: 4px;
			background: #262626;
			color: #eee;
		}

		button {
			margin-top: 24px;
			border: none;
			background: #2f6fed;
			font-weight: bold;
			cursor: pointer;
		}

		button:hover {
			background: #4780f5;
		}

		.error {
			margin-top: 18px;
			color: #ff8080;
			font-weight: bold;
		}

	</style>

</head>

<body>

	<h1>Administrator Login</h1>

	<form id="loginForm">

		<label>Email</label>

		<input
			type="email"
			id="email"
			required
			autocomplete="username"
		/>

		<label>Password</label>

		<input
			type="password"
			id="password"
			required
			autocomplete="current-password"
		/>

		<button type="submit">
			Login
		</button>

	</form>

	<p
		id="status"
		class="error"
	></p>

	<script>

		const form = document.getElementById("loginForm");

		const status = document.getElementById("status");

		form.addEventListener("submit", async (event) => {

			event.preventDefault();

			status.textContent = "";

			try {

				const response = await fetch(
					"/api/admin/login",
					{
						method: "POST",

						headers: {
							"Content-Type": "application/json"
						},

						body: JSON.stringify({

							email: document.getElementById("email").value,

							password: document.getElementById("password").value

						})

					}
				);

				const data = await response.json();

				if (!response.ok) {

					status.textContent =
						data.error || "Login failed.";

					return;

				}

				localStorage.setItem(
					"taleem-token",
					data.token
				);

				localStorage.setItem(
					"taleem-email",
					document.getElementById("email").value
				);

				location.href = "/api/admin/index.html";

			}
			catch (err) {

				status.textContent = err.message;

			}

		});

	</script>

</body>

</html>
