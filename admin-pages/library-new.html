<!DOCTYPE html>
<html lang="en">

<head>

	<meta charset="UTF-8" />

	<meta
		name="viewport"
		content="width=device-width, initial-scale=1.0"
	/>

	<title>Taleem Server - New Library Item</title>

	<style>

		:root {
			color-scheme: dark;
		}

		body {
			font-family: system-ui, sans-serif;
			max-width: 900px;
			margin: 40px auto;
			padding: 24px;
			background: #181818;
			color: #eee;
		}

		h1 {
			margin-top: 0;
		}

		label {
			display: block;
			margin-top: 16px;
			margin-bottom: 6px;
			font-weight: 600;
		}

		input,
		select,
		textarea {
			width: 100%;
			padding: 10px;
			box-sizing: border-box;
			font-size: 1rem;
			border: 1px solid #555;
			border-radius: 4px;
			background: #262626;
			color: #eee;
		}

		textarea {
			height: 320px;
			font-family: monospace;
		}

		button {
			margin-top: 20px;
			padding: 10px 18px;
			border: none;
			border-radius: 4px;
			background: #2f6fed;
			color: white;
			font-weight: bold;
			cursor: pointer;
		}

		button:hover {
			background: #4780f5;
		}

		.toolbar {
			display: flex;
			gap: 10px;
			margin-top: 24px;
		}

		.success {
			color: #7CFC8A;
			font-weight: bold;
		}

		.error {
			color: #ff8080;
			font-weight: bold;
		}

	</style>

</head>

<body>

	<h1>New Library Item</h1>

	<form id="form">

		<label>Slug</label>
		<input
			id="slug"
			required
		/>

		<label>Title</label>
		<input
			id="title"
			required
		/>

		<label>Thumbnail</label>
		<input
			id="thumbnail"
			placeholder="/content/images/example.webp"
		/>

		<label>Type</label>

		<select id="type">

			<option value="HTML">HTML</option>
			<option value="TEXT">TEXT</option>
			<option value="MARKDOWN">MARKDOWN</option>
			<option value="JSON">JSON</option>

		</select>

		<label>Course</label>

		<select
			id="courseSlug"
			required
		></select>

		<label>Body</label>
		<textarea id="body"></textarea>

		<div class="toolbar">

			<button type="submit">
				Create
			</button>

			<button
				type="button"
				onclick="location.href='/api/admin/library'"
			>
				Cancel
			</button>

		</div>

	</form>

	<p id="status"></p>

	<script type="module">

		import loadCourses from "/api/js/loadCourses";

		const token = localStorage.getItem("taleem-token");

		const status = document.getElementById("status");

		await loadCourses("courseSlug");

		document.getElementById("form")
			.addEventListener("submit", async (event) => {

				event.preventDefault();

				try {

					const response = await fetch(
						"/api/admin/library",
						{
							method: "POST",

							headers: {
								"Content-Type": "application/json",
								Authorization: `Bearer ${token}`
							},

							body: JSON.stringify({

								slug: document.getElementById("slug").value.trim(),

								title: document.getElementById("title").value.trim(),

								thumbnail: document.getElementById("thumbnail").value.trim(),

								type: document.getElementById("type").value,

								courseSlug: document.getElementById("courseSlug").value,

								body: document.getElementById("body").value

							})

						}
					);

					const data = await response.json();

					if (!response.ok) {

						status.className = "error";
						status.textContent =
							data.error || "Unable to create library item.";

						return;

					}

					location.href = "/api/admin/library";

				}
				catch (err) {

					status.className = "error";
					status.textContent = err.message;

				}

			});

	</script>

</body>

</html>
