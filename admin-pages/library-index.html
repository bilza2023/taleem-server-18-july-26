<!DOCTYPE html>
<html lang="en">

<head>

	<meta charset="UTF-8" />

	<meta
		name="viewport"
		content="width=device-width, initial-scale=1.0"
	/>

	<title>Taleem Server - Library</title>

	<style>

		:root {
			color-scheme: dark;
		}

		body {
			font-family: system-ui, sans-serif;
			max-width: 1100px;
			margin: 40px auto;
			padding: 24px;
			background: #181818;
			color: #eee;
		}

		h1 {
			margin-top: 0;
		}

		.toolbar {
			display: flex;
			gap: 12px;
			margin-bottom: 20px;
		}

		button {
			padding: 10px 16px;
			border: none;
			border-radius: 4px;
			background: #2f6fed;
			color: white;
			cursor: pointer;
			font-weight: bold;
		}

		button:hover {
			background: #4780f5;
		}

		table {
			width: 100%;
			border-collapse: collapse;
		}

		th,
		td {
			border: 1px solid #444;
			padding: 10px;
			text-align: left;
			vertical-align: top;
		}

		th {
			background: #252525;
		}

		tr:nth-child(even) {
			background: #202020;
		}

		a {
			color: #8ec8ff;
			text-decoration: none;
		}

		a:hover {
			text-decoration: underline;
		}

		#error {
			color: #ff8080;
			font-weight: bold;
			margin-bottom: 20px;
		}

	</style>

</head>

<body>

	<h1>Library</h1>

	<div class="toolbar">

		<button onclick="location.href='/api/admin/library/new'">
			New Library Item
		</button>

		<button onclick="loadLibrary()">
			Refresh
		</button>

	</div>

	<div id="error"></div>

	<table>

		<thead>

			<tr>
				<th>Slug</th>
				<th>Title</th>
				<th>Type</th>
				<th>Course</th>
				<th>Actions</th>
			</tr>

		</thead>

		<tbody id="tbody"></tbody>

	</table>

	<script>

		const token = localStorage.getItem("taleem-token");

		const tbody = document.getElementById("tbody");

		const error = document.getElementById("error");

		async function loadLibrary() {

			error.textContent = "";

			tbody.innerHTML = "";

			try {

				const response = await fetch(
					"/api/public/library",
					{
						headers: {
							Authorization: `Bearer ${token}`
						}
					}
				);

				const items = await response.json();

				if (!response.ok) {

					error.textContent =
						items.error || "Unable to load library.";

					return;

				}

				for (const item of items) {

					const tr = document.createElement("tr");

					tr.innerHTML = `
						<td>${item.slug}</td>
						<td>${item.title}</td>
						<td>${item.type}</td>
						<td>${item.courseSlug ?? ""}</td>
						<td>
							<a href="/api/admin/library/edit?slug=${encodeURIComponent(item.slug)}">
								Edit
							</a>
						</td>
					`;

					tbody.appendChild(tr);

				}

			}
			catch (err) {

				error.textContent = err.message;

			}

		}

		loadLibrary();

	</script>

</body>

</html>
